[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hispaniolan_crossbill_study"
version = "0.0.1"
description = "This is a focused study on the Hispaniolan Crossbill."
authors = [
  { name = "Alen Abreu" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["hispaniolan_crossbill_study"]
include = ["pyproject.toml", "hispaniolan_crossbill_study/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["hispaniolan_crossbill_study"]
force-sort-within-sections = true

